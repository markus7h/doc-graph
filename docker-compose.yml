services:
  doc-graph:
    build: .
    container_name: doc-graph
    restart: unless-stopped
    ports:
      - "5775:5775"   # MCP (streamable HTTP)
      - "5776:5776"   # Graph-Viewer (statisches HTML)
    environment:
      # --- LLM + Embeddings ueber den llm-stack-Router (LiteLLM auf mystorage),
      # fuer Ingest UND Query. Dahinter zwei Backends: myai als Basis, myubuntu
      # als Burst-Host mit RTX 5080 (gemessen 86,9 gegen 36,7 tok/s). Der Router
      # verteilt gewichtet und faengt ab, wenn ein Host wegfaellt — myai schlaeft
      # 23:00-06:00, myubuntu ist ein Desktop und darf jederzeit weg sein.
      #
      # mystorage.LAN, nicht mystorage: Docker erbt den /etc/hosts-Eintrag des
      # Hosts fuer dessen eigenen Namen, im Container loest "mystorage" damit auf
      # 127.0.1.1 auf und der Call landet im Container selbst. Anders als bei
      # 'paperless' loest der .lan-Name hier auf IPv4 UND IPv6 auf; der
      # IPv6-Versuch faellt in ~20 ms auf IPv4 zurueck.
      #
      # Zurueck auf http://myai:11436/v1 bzw. :11435/v1 ist jederzeit moeglich —
      # die direkten Ports bleiben auf beiden GPU-Hosts offen.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mystorage.lan:11437/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://mystorage.lan:11437/v1}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      # Master-Key des Routers — er laeuft mit einem, weil seine Admin-UI ihn
      # verlangt, und antwortet ohne Header mit 401. server.py schickt ihn schon
      # immer mit (LLM- wie Embedding-Pfad), bisher nur an einen llama-server,
      # den er nicht interessiert hat.
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 1800 statt der Code-Default 2048: der Zeichen-Cap in _cap_embed_input
      # rechnet EMBED_MAX_TOKENS * 3 und liegt damit exakt auf llama.cpps
      # -ub 2048 — ohne Reserve. Ein Ueberlauf quittiert der Server mit HTTP 500
      # ("input ... is too large"), was der Router nicht von einem toten Backend
      # unterscheiden kann: er wuerde den gesunden Host in den Cooldown schicken.
      # 1800 gibt ~12 % Luft; die Halbierungs-Notbremse in _embed_post_einmal
      # bleibt als zweite Verteidigungslinie.
      EMBED_MAX_TOKENS: ${EMBED_MAX_TOKENS:-1800}
      # --- Paperless-NGX (Dokumentquelle): direkt ueber dessen Compose-Netz
      # web_net als Container-Alias 'webserver'. NICHT ueber https://paperless —
      # der LAN-Name loest nur auf IPv6 auf, und die Docker-Bridge kann kein IPv6
      # ("Network is unreachable", 2026-08-05). ---
      PAPERLESS_URL: ${PAPERLESS_URL:-http://webserver:8000}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN}
      # --- Server ---
      MCP_PORT: "5775"
      VIEWER_PORT: "5776"
      PUBLIC_HOST: ${PUBLIC_HOST:-mystorage}   # Host für die Viewer-URL im Browser
      PROJECTS_DIR: /data/projects
      # --- Backup: tar.gz der Projekte ins gemountete Ziel, Zeitplan in der Web-UI ---
      BACKUP_DIR: /backups
      MAX_BACKUPS: ${MAX_BACKUPS:-10}
      # 3 statt 2: hinter dem Router liegen jetzt drei qwen-Slots (myubuntu 2x
      # nach Gewicht, myai 1x) statt einem. Ist myubuntu aus, serialisiert myai
      # die Calls wie bisher — mehr Nebenlaeufigkeit schadet dann nicht, sie
      # wartet nur.
      MAX_ASYNC: ${MAX_ASYNC:-3}
      # Sicherheits-Guard: Docs über dieser Zeichenzahl werden geflaggt statt
      # ingestiert (siehe README). 400k (~166 Chunks) lässt große Fachdokumente
      # durch, fängt aber Kalender-/CSV-Exporte (490k+).
      MAX_DOC_CHARS: ${MAX_DOC_CHARS:-400000}
      # Timeout je LLM-Call (s). Bei CPU-Offload/niedrigem t/s hochsetzen. ---
      LLM_TIMEOUT: ${LLM_TIMEOUT:-480}
    volumes:
      # Persistente KG-Stores, ein Unterordner pro Projekt.
      # ABSOLUTER Pfad bewusst: ein 'docker compose up' aus dem Git-Repo (falsches
      # CWD) darf NICHT ./data des Repos mounten -> sonst leerer Index, alle Queries
      # liefern no-context. Kanonischer Datenort ist das Deploy-Dir.
      - /var/local/mydocker/doc-graph/data/projects:/data/projects
      # Backup-Ziel (analog ai-rem: eigener Ordner neben ai-rem in OneDrive).
      # Der Server rotiert dort auf die letzten MAX_BACKUPS Archive.
      # Auf mystorage liegt OneDrive nativ unter /shares/data/homes/markus (kein CIFS).
      - ${DOC_GRAPH_BACKUP_PATH:-/shares/data/homes/markus/OneDrive/doc-graph}:/backups
      # Optional für ingest_directory: lokales Dokumentverzeichnis read-only.
      # Pfad an den Host anpassen und einkommentieren (Verzeichnis muss existieren,
      # sonst legt Docker es leer als root an); primäre Quelle bleibt Paperless.
      # - /home/markus/dokumente:/data/inputs:ro
    networks:
      default:
      # Feste IPv6 statt dynamischer Vergabe: Caddy proxyt https://docgraph auf
      # genau diese Adresse (Hauskonvention: letztes Segment = Port, wie bei
      # case-assist ::5777 und paperless ::8090). Ohne die Zuweisung vergibt
      # Docker eine beliebige (zuletzt ::6), Caddy laeuft in 'i/o timeout'
      # und liefert 502 — ueber den Port-Mount :5776 bleibt der Viewer dabei
      # erreichbar, was die Fehlersuche verschleiert (2026-08-29).
      web_net:
        ipv6_address: fd00:24:9:68:23::5776

# Gehoert dem paperless-ngx-Compose-Projekt (compose-files/paperless).
networks:
  web_net:
    external: true
